# Netlify 배포 설정
# push하면 build-site.mjs가 site/ 폴더를 만들어 공개하고, netlify/functions/ 의 서버 함수(상담 신청 · 방문 집계 · 관리자)를 함께 올린다.
# 관리자 비밀번호는 여기에 쓰지 않는다. Netlify 화면의 환경 변수 ADMIN_PASSWORD 로 넣는다.
[build]
  command = "node build-site.mjs"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
